name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check geopy==2.5.0

      - name: Compile Python files
        run: >-
          python -m py_compile
          main.py run.py config.py
          driver/connect.py driver/location.py
          init/init.py init/tunnel.py init/route.py
          util/route.py util/console_guard.py
          tests/test_smoke.py

      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
